name: Build and Deploy to GitHub Pages

on:
  # Rebuild every day to pick up Notion changes
  schedule:
    - cron: '0 0 * * *'

  # main: build + deploy. dev: build only (check that the export still works)
  push:
    branches:
      - main
      - dev

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Required GitHub Secret:
#   ENV_FILE - full content of the production .env.local (Notion token, DB IDs, property keys,
#              NEXT_PUBLIC_SITE_DOMAIN=https://dinhanhthi.com, ...)
# Repo Settings > Pages > Source must be "GitHub Actions".
#
# No .next/cache restore on purpose: with `output: 'export'` every Notion fetch goes through
# Next's data cache, so a restored cache would rebuild stale Notion content.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ERROR: secret ENV_FILE is not set (see the header of this workflow)"
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env.local

      - name: Build
        env:
          ENV_MODE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          NEXT_PUBLIC_ENV_MODE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: pnpm run build

      - name: Site size
        run: du -sh out

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
