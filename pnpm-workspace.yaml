# Auto install peer dependencies
autoInstallPeers: true

# Hoist dependencies to node_modules root (compatibility)
shamefullyHoist: true

# Prevent React duplicates (fix useRef/useContext null errors)
publicHoistPattern:
  - '*react*'
  - '*react-dom*'

overrides:
  d3: ^7.9.0
  dompurify: ^3.4.0
  react: 19.1.0
  react-dom: 19.1.0

allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
